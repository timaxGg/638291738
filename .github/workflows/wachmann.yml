# Der Wachmann: startet automatisch. Zu US-Börsenzeiten alle 5 Minuten, sonst alle 15 Minuten.
name: Wachmann
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
    - cron: "2,17,32,47 0-12,22-23 * * *"
    - cron: "2,17,32,47 13-21 * * 0,6"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: wachmann
  cancel-in-progress: false
jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gedächtnis laden
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: wachmann-${{ github.run_id }}
          restore-keys: wachmann-
      - name: Wachmann läuft
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          AV_KEY: ${{ secrets.AV_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          SYNC_PASSWORD: ${{ secrets.SYNC_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KI_ROUTINE_URL: ${{ secrets.KI_ROUTINE_URL }}
          KI_ROUTINE_TOKEN: ${{ secrets.KI_ROUTINE_TOKEN }}
        run: node bot/wachmann.mjs
      - name: Gedächtnis speichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: wachmann-${{ github.run_id }}

name: Test ETF-Kürzel
on:
  push:
    paths: [".github/workflows/test-etf.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for s in IUSQ.DE XMME.DE EUNK.DE EXSA.DE EUNH.DE XEON.DE 4GLD.DE XDEW.DE IS3R.DE EUNA.DE XDWL.DE EXUS.DE XMUS.DE EXW1.DE IQQ6.DE VGWD.DE ISPA.DE EXX5.DE XDEM.DE IS3S.DE IS3Q.DE XWEU.DE WEXU.DE SXRV.DE EUNM.DE VFEM.DE MEUD.DE LYP6.DE XGLE.DE IBCI.DE SXR8.DE VWCE.DE ^VIX ^V2TX BTC-EUR ETH-EUR SOL-EUR XRP-EUR BNB-EUR ADA-EUR DOGE-EUR; do
            curl -s -m 15 -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/$s?range=5d&interval=1d" | python3 -c "import json,sys
          try:
            m=json.load(sys.stdin)['chart']['result'][0]['meta'];print('$s',m.get('currency'),m.get('regularMarketPrice'),'|',m.get('longName') or m.get('shortName'))
          except Exception as e: print('$s','FEHLT')"
          done
